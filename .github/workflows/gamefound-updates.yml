name: Update Gamefound

on:
  schedule:
    - cron: "15 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gamefound:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Gamefound updates
        run: npx tsx scripts/update-gamefound.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/gamefound-updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Lo Spacca Dadi Bot"
          git config user.email "actions@github.com"
          git add data/gamefound-updates.json
          git commit -m "Update Gamefound data"
          git push